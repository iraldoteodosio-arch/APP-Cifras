<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Guitar Silhouette Frame -->
  <path d="M 330 110 C 370 150 370 210 335 245 C 370 280 380 340 330 395 C 275 450 190 440 145 385 C 105 335 110 265 145 225 C 130 195 135 155 170 120 C 220 70 290 70 330 110 Z" 
        fill="none" 
        stroke="#1e293b" 
        stroke-width="12" />

  <!-- Soundhole ring -->
  <circle cx="240" cy="270" r="54" fill="#020617" stroke="#334155" stroke-width="8" />
  <circle cx="240" cy="270" r="46" fill="none" stroke="#10b981" stroke-width="3" opacity="0.6" />

  <!-- Glowing acoustic strings (6 strings with wave curve) -->
  <path d="M 175 145 Q 230 250 215 365" fill="none" stroke="url(#emeraldGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 195 135 Q 240 255 228 360" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 215 125 Q 250 260 241 355" fill="none" stroke="url(#emeraldGrad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 235 115 Q 260 265 254 350" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 255 105 Q 270 270 267 345" fill="none" stroke="url(#emeraldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 275 95 Q 280 275 280 340" fill="none" stroke="url(#emeraldGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Bridge -->
  <rect x="200" y="360" width="95" height="18" rx="6" fill="#334155" stroke="#475569" stroke-width="2" />
  <!-- Bridge pins -->
  <circle cx="212" cy="369" r="2.5" fill="#e2e8f0" />
  <circle cx="226" cy="369" r="2.5" fill="#e2e8f0" />
  <circle cx="240" cy="369" r="2.5" fill="#e2e8f0" />
  <circle cx="254" cy="369" r="2.5" fill="#e2e8f0" />
  <circle cx="268" cy="369" r="2.5" fill="#e2e8f0" />
  <circle cx="282" cy="369" r="2.5" fill="#e2e8f0" />
</svg>
